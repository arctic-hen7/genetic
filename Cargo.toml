[package]
name = "genetic"
version = "0.1.0"
edition = "2021"

[dependencies]
num-traits = "0.2.19"
rand = "0.9.0"
rand_xoshiro = "0.7.0"
rayon = "1.10.0"
thiserror = "2.0.11"
ordered-float = "5.0.0"
frunk = "0.4.3"
plotters = { version = "0.3.7", optional = true }
ahash = "0.8.12"
lru = { version = "0.16.3", no-default-features = true }

[dev-dependencies]
ordered-float = { version = "5.0.0", features = [ "rand" ] }

[lib]
name = "genetic"
path = "src/lib.rs"

[features]
default = [ "viz" ]
viz = [ "plotters" ]
